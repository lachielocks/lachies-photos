<!doctype html>
<html lang="en" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lachie's Photos</title>
  <meta name="description" content="A photography class gallery." />
  <meta name="author" content="" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    document.documentElement.className = 'js'
  </script>
  <style>html { background: #08080c; }</style>
</head>

<body class="demo-1">
  <div id="loading-screen">
    <p id="loading-header">Lachie's Photos</p>
    <ul id="loading-steps" role="status" aria-live="polite">
      <li class="loading-step" data-step="environment" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Loading Environment</span>
      </li>
      <li class="loading-step" data-step="photos" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Loading Photos</span>
        <span class="loading-step__count" id="loading-photo-count"></span>
      </li>
      <li class="loading-step" data-step="rendering" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Rendering</span>
      </li>
    </ul>
  </div>
  <main>
    <header class="frame">
      <h1 class="frame__title">Lachie's Photos</h1>
      <button class="frame__present-toggle" aria-label="Toggle present mode">Present</button>
      <button class="frame__menu-toggle" aria-label="Open photo index">Menu</button>
    </header>
    <div class="gallery-arrows">
      <button class="gallery-arrows__btn gallery-arrows__btn--up" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button class="gallery-arrows__btn gallery-arrows__btn--down" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
    <nav class="gallery-nav" aria-hidden="true">
      <button class="gallery-nav__close" aria-label="Close photo index">Close</button>
      <ol class="gallery-nav__list"></ol>
    </nav>
    <div class="content">
      <canvas class="webgl"></canvas>
    </div>
    <div class="progress-bar" aria-hidden="true">
      <div class="progress-bar__fill"></div>
    </div>
    <div class="photo-counter" aria-live="polite" aria-atomic="true"></div>
    <button class="share-btn" aria-label="Share current photo" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
    <button class="download-btn" aria-label="Download current photo" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="mute-btn" aria-label="Unmute music" data-muted="true" tabindex="0">
      <!-- Unmuted: speaker with waves -->
      <svg class="mute-btn__icon--sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <!-- Muted: speaker with X -->
      <svg class="mute-btn__icon--muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
