<!doctype html>
<html lang="en" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lachie's Photos</title>
  <meta name="description" content="A photography class gallery." />
  <meta name="author" content="" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    document.documentElement.className = 'js'
  </script>
  <style>html { background: #08080c; }</style>
</head>

<body class="demo-1">
  <div id="loading-screen">
    <p id="loading-header">Lachie's Photos</p>
    <ul id="loading-steps" role="status" aria-live="polite">
      <li class="loading-step" data-step="environment" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Loading Environment</span>
      </li>
      <li class="loading-step" data-step="photos" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Loading Photos</span>
        <span class="loading-step__count" id="loading-photo-count"></span>
      </li>
      <li class="loading-step" data-step="rendering" data-state="pending">
        <span class="loading-step__icon" aria-hidden="true"></span>
        <span class="loading-step__label">Rendering</span>
      </li>
    </ul>
  </div>
  <main>
    <header class="frame">
      <h1 class="frame__title">Lachie's Photos</h1>
      <button class="frame__present-toggle" aria-label="Toggle present mode">Present</button>
      <button class="frame__menu-toggle" aria-label="Open photo index">Menu</button>
    </header>
    <div class="gallery-arrows">
      <button class="gallery-arrows__btn gallery-arrows__btn--up" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button class="gallery-arrows__btn gallery-arrows__btn--down" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
    <nav class="gallery-nav" aria-hidden="true">
      <button class="gallery-nav__close" aria-label="Close photo index">Close</button>
      <ol class="gallery-nav__list"></ol>
    </nav>
    <div class="content">
      <canvas class="webgl"></canvas>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
